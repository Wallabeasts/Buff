<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Buff: a Monday-to-Sunday lifting plan that tells you what to do, tracks your weights and loads plates on the bar as you level up.">
<meta name="theme-color" content="#3626D9">
<title>Buff</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --chalk:#E8EAFB; --panel:#FFFFFF; --ink:#181B4A; --mute:#5A5F8C; --line:#D3D7F2;
  --red:#F0650A; --blue:#4A36F5; --yellow:#F2B705; --green:#0E8A45; --steel:#9AA0C8;
  --on-ink:#FFFFFF; --on-accent:#1A1033;
  --hero:#3626D9; --hero-2:#5B3DF5; --hero-ink:#FFFFFF; --hero-mute:#D2CCFF; --hero-line:rgba(255,255,255,.34);
  --p1:#FF8A3D; --p2:#FFD23F; --p3:#4DE1D2; --p4:#FF6FA3;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chalk:#0F1130; --panel:#1B1E4D; --ink:#F0F1FF; --mute:#A4A9D6; --line:#30346E;
    --red:#FF8A3D; --blue:#9A8CFF; --yellow:#FFD23F; --green:#3DD68C; --steel:#6E74A8;
    --on-ink:#0F1130; --hero:#2A1FB8; --hero-2:#4530D9;
  }
}
:root[data-theme="dark"]{
  --chalk:#0F1130; --panel:#1B1E4D; --ink:#F0F1FF; --mute:#A4A9D6; --line:#30346E;
  --red:#FF8A3D; --blue:#9A8CFF; --yellow:#FFD23F; --green:#3DD68C; --steel:#6E74A8;
  --on-ink:#0F1130; --hero:#2A1FB8; --hero-2:#4530D9;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--chalk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 130px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--chalk)}
.top-in{max-width:560px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;color:var(--blue)}
.mark i{display:inline-block;width:10px;height:24px;background:var(--red);border-radius:3px;margin-right:6px;vertical-align:-2px;font-style:normal;animation:markin .7s cubic-bezier(.2,1.5,.4,1) both}
.purse{display:flex;gap:8px;font-weight:600;font-size:14px}
.purse span{background:var(--panel);border-radius:999px;padding:5px 12px}
.purse span b{font-family:var(--display);font-size:19px;font-weight:700;margin-right:4px;display:inline-block}
.purse.bump span:last-child{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}

h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0}
h1{font-size:36px} h2{font-size:24px} h3{font-size:20px}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:14px}

.hero{padding:20px 2px 4px}
.hero-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px}
.hero-row p{white-space:nowrap}
.herocard{margin-top:10px;border-radius:24px;padding:18px 18px 14px;color:var(--hero-ink);background:linear-gradient(150deg,var(--hero-2),var(--hero) 62%);position:relative;overflow:hidden}
.herocard::after{content:"";position:absolute;right:-70px;top:-90px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.herocard h1{font-size:44px}
.herocard p{color:var(--hero-mute);font-weight:500}
.herocard .hsub{font-size:15px;margin-bottom:2px}
.herocard .hint{font-size:13px;text-align:center}
.herocard .meter{background:var(--hero-line)}
.lift{display:block;width:100%;background:none;border:0;padding:0;margin:4px 0 0;position:relative;z-index:1}
.lift svg{display:block;width:100%;height:auto;overflow:visible}
.lift .bar{fill:#E9E6FF}.lift .collar{fill:#FFFFFF}
.lift .slot{fill:none;stroke:var(--hero-line);stroke-width:1.5;stroke-dasharray:4 3}
.lift .fill{fill:rgba(255,255,255,.6)}
.lift .gold{fill:#FFD23F;stroke:#FFF6C9;stroke-width:1.5}
.lift .ice{fill:#EAFBFF;stroke:var(--p3);stroke-width:2}
.lift .p1{fill:var(--p1)}.lift .p2{fill:var(--p2)}.lift .p3{fill:var(--p3)}.lift .p4{fill:var(--p4)}
.lift .shadow{fill:rgba(10,6,60,.35);transform-box:fill-box;transform-origin:center}
.lift .bb{animation:bob 3.6s ease-in-out infinite}
.lift svg.rep .bb{animation:rep .95s cubic-bezier(.3,.7,.3,1)}
.lift svg.rep .shadow{animation:shrink .95s cubic-bezier(.3,.7,.3,1)}
.lift svg.rep .pl{animation:rattle .95s ease-in-out}
.pl.l.new,.enter .pl.l{animation:inL .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*90ms + 150ms)}
.pl.r.new,.enter .pl.r{animation:inR .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*90ms + 150ms)}
.pl.new{animation-delay:0s!important}

.panel{background:var(--panel);border-radius:20px;padding:16px;margin-top:12px}
.panel.today{box-shadow:0 0 0 3px var(--blue)}
.panel h2{margin-bottom:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}

.btn{min-height:48px;padding:0 20px;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:var(--on-ink);font-weight:600;font-size:16px;transition:transform .12s ease,background .2s,border-color .2s}
.btn:active,.opt:active,.set:active,.seg button:active,.tabs button:active{transform:scale(.94)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.quote{background:var(--yellow);color:#231A00}
.quote p{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.12}
.xpbars{display:flex;gap:6px;align-items:flex-end;height:72px;margin-top:12px}
.xpbars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.xpbars i{display:block;background:var(--blue);border-radius:6px 6px 0 0;min-height:3px;transform-origin:bottom}
.enter .xpbars i{animation:growY .7s cubic-bezier(.2,1.2,.4,1) .25s both}
.xplab{display:flex;gap:6px;margin-top:4px}
.xplab span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{min-height:48px;text-align:left;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:transparent;font-weight:500;transition:transform .12s,background .2s,border-color .2s,color .2s}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--on-ink)}
tr.cur td{font-weight:600;background:var(--chalk)}
.fig{display:block;width:100%;height:auto;margin:10px auto 6px}
.fig text{font-family:var(--body);font-size:11px;fill:var(--mute)}
.fig.anim{max-width:190px}
.fig.still{max-width:340px;display:none}
.fig.hold{max-width:190px}
.fig.anim .pa{animation:fa 2.6s ease-in-out infinite}
.fig.anim .pb{animation:fb 2.6s ease-in-out infinite}
.fig.hold g{animation:pulse 2.4s ease-in-out infinite;transform-origin:center}
details.how{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.how summary{min-height:36px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details.how[open]>*:not(summary){animation:rise .35s both}

.big{font-family:var(--display);font-weight:700;font-size:54px;line-height:.9}
.days{display:flex;gap:6px;margin-top:12px}
.day{flex:1;text-align:center;font-size:12px;color:var(--mute);font-weight:500}
.day i{display:block;height:34px;border-radius:12px;background:var(--chalk);margin-bottom:5px}
.day.off i{background:repeating-linear-gradient(135deg,var(--chalk) 0 5px,transparent 5px 10px)}
.day.on i{background:var(--red)}
.day.now{color:var(--ink);font-weight:700}
.day.now i{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--blue)}
.enter .day i{animation:popin .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*55ms + 200ms)}

.quest{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.quest:first-of-type{border-top:0}
.pips{display:flex;gap:4px;margin-top:6px}
.pips i{width:16px;height:10px;border-radius:4px;background:var(--line);transition:background .3s}
.pips i.on{background:var(--blue)}
.check{min-width:96px}
.done-tag{font-weight:700;color:var(--green);font-size:14px;animation:popin .4s cubic-bezier(.2,1.6,.4,1)}

.meter{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--red);border-radius:999px;transform-origin:left;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.enter .meter i{animation:growX .9s cubic-bezier(.2,.8,.2,1) .25s both}

.seg{display:flex;background:var(--chalk);border-radius:14px;padding:4px;gap:4px;margin-top:12px}
.panel .seg{background:var(--chalk)}
.hero .seg{background:var(--panel)}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:600;transition:transform .12s,background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-ink)}
.ex{background:var(--panel);border-radius:20px;padding:14px 16px;margin-top:10px;border:2px solid transparent;transition:border-color .4s}
.ex.all{border-color:var(--green)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.set{width:54px;height:48px;border-radius:14px;border:2px solid var(--line);background:transparent;font-family:var(--display);font-weight:700;font-size:20px;transition:transform .12s,background .2s,border-color .2s,color .2s}
.set[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-ink)}
.pop{animation:popin .45s cubic-bezier(.2,1.8,.4,1)}
.fields{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.fields label{font-size:14px;color:var(--mute);display:flex;align-items:center;gap:6px}
.step{min-width:44px;min-height:42px;padding:0 8px;border-radius:12px;border:2px solid var(--line);background:transparent;font-weight:700;transition:transform .12s}
.step:active{transform:scale(.9)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stats div{background:var(--panel);border-radius:20px;padding:14px 16px}
.stats b{display:block;font-family:var(--display);font-size:40px;line-height:1}
.fields input{width:72px;min-height:42px;border:2px solid var(--line);border-radius:12px;background:var(--chalk);padding:0 8px;font-weight:600}
textarea,.txt{width:100%;border:2px solid var(--line);border-radius:12px;background:var(--chalk);padding:10px;min-height:46px}
textarea{min-height:84px;resize:vertical}

.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--mute);border-top:0;font-size:14px}
.scroll{overflow-x:auto}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs-in{max-width:540px;margin:0 auto;display:flex;gap:2px;background:var(--panel);border-radius:20px;padding:6px;box-shadow:0 8px 28px rgba(24,27,74,.22);pointer-events:auto;animation:rise .5s .2s both}
.tabs button{flex:1;min-width:0;font-size:13px;padding:0 2px;min-height:46px;border:0;border-radius:14px;background:transparent;font-weight:600;color:var(--mute);transition:background .3s,color .3s,transform .12s}
.tabs button[aria-current="page"]{color:var(--on-ink);background:var(--blue)}

#rest{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;display:none;padding:0 16px}
#rest .in{max-width:528px;margin:0 auto 8px;background:var(--ink);color:var(--on-ink);border-radius:16px;padding:8px 8px 8px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:600;position:relative;overflow:hidden;animation:rise .35s both}
#rest b{font-family:var(--display);font-size:24px;margin-left:8px}
#rest button{min-height:38px;padding:0 12px;border-radius:10px;border:2px solid var(--on-ink);background:transparent;color:var(--on-ink);font-weight:600;position:relative}
#restBar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--red);transform-origin:left}

#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px) scale(.9);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .35s cubic-bezier(.2,1.6,.4,1);z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.xpf{position:fixed;z-index:10;pointer-events:none;font-family:var(--display);font-weight:700;font-size:24px;color:var(--red);transform:translate(-50%,-50%);animation:floatup 1s ease-out forwards;text-shadow:0 1px 0 var(--panel)}
#lvl{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:var(--hero);color:#fff;overflow:hidden}
#lvl.show{display:grid;animation:fade .25s both}
#lvl i{position:absolute;top:-24px;left:var(--x);width:10px;height:18px;border-radius:3px;background:var(--c);animation:fall 1.9s var(--d) cubic-bezier(.3,.2,.6,1) forwards}
.lvbox{text-align:center;animation:zoom .6s cubic-bezier(.2,1.6,.4,1) both}
.lvbox p{font-family:var(--display);font-size:30px;font-weight:600;color:var(--hero-mute)}
.lvbox b{display:block;font-family:var(--display);font-size:150px;line-height:.9}
.verdict{animation:zoom .6s cubic-bezier(.2,1.6,.4,1) .15s both;transform-origin:left center}

#view.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.06s}#view.enter>*:nth-child(3){animation-delay:.12s}
#view.enter>*:nth-child(4){animation-delay:.18s}#view.enter>*:nth-child(5){animation-delay:.24s}
#view.enter>*:nth-child(6){animation-delay:.3s}#view.enter>*:nth-child(n+7){animation-delay:.36s}

#tour{position:fixed;inset:0;z-index:30;display:none}
#tour.show{display:block}
#tour .hole{position:fixed;border-radius:22px;box-shadow:0 0 0 200vmax rgba(15,17,48,.74);transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1),height .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#tour .hole::after{content:"";position:absolute;inset:-3px;border-radius:24px;border:3px solid var(--p2);animation:ring 1.6s ease-in-out infinite}
#tour .tcard{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--panel);color:var(--ink);border-radius:20px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:rise .35s both}
#tour .tcard h2{margin:2px 0 4px}
#tour .tdots{display:flex;gap:5px;margin-top:12px}
#tour .tdots i{height:6px;flex:1;border-radius:3px;background:var(--line);transition:background .3s}
#tour .tdots i.on{background:var(--blue)}
.memitem{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.memitem:first-of-type{border-top:0}
.memitem span{flex:1;min-width:0;overflow-wrap:anywhere}
.note{margin-top:8px;padding:8px 12px;border-radius:12px;background:var(--chalk);font-size:14px;overflow-wrap:anywhere}
.remind{background:var(--yellow);color:#231A00}
.remind .mute{color:#4A3B00}
.memlink{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:12px;border:0;color:inherit;font:inherit;cursor:pointer;transition:transform .12s}
.memlink:active{transform:scale(.98)}
.memlink .go{font-family:var(--display);font-size:28px;color:var(--blue)}
@keyframes ring{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoom{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes popin{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes markin{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes rep{0%{transform:translateY(0)}14%{transform:translateY(5px)}52%,66%{transform:translateY(-34px)}88%{transform:translateY(3px)}100%{transform:translateY(0)}}
@keyframes shrink{0%,100%{transform:scale(1);opacity:1}52%,66%{transform:scale(.6);opacity:.45}}
@keyframes rattle{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(2px)}94%{transform:translateY(-1px)}}
@keyframes inL{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes fa{0%,36%{opacity:1}50%,86%{opacity:0}100%{opacity:1}}
@keyframes fb{0%,36%{opacity:0}50%,86%{opacity:1}100%{opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes floatup{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-70px}}
@keyframes fall{to{transform:translateY(115vh) rotate(var(--r))}}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .fig.anim{display:none}.fig.still{display:block}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="mark"><i></i>Buff</div>
  <div class="purse" id="purse"></div>
</div></header>
<main class="wrap" id="view"></main>
<div id="rest"><div class="in"><span>Rest<b id="restT"></b></span><button data-act="skiprest">Skip rest</button><i id="restBar"></i></div></div>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lvl" aria-hidden="true"></div>
<div id="tour"></div>

<script>
(function(){
"use strict";
var KEY="buff-state-v1";

var PLAN=[
 {id:"ua",name:"Upper A",note:"Chest, shoulders and arms",ex:[
  {id:"dbbench",n:"Dumbbell bench press",m:1},
  {id:"row1",n:"One-arm dumbbell row",side:1,m:1},
  {id:"ohp",n:"Overhead press",m:1},
  {id:"curl",n:"Dumbbell curl"},
  {id:"triext",n:"Overhead triceps extension"}]},
 {id:"la",name:"Lower A",note:"Squat day",ex:[
  {id:"goblet",n:"Goblet squat",m:1},
  {id:"rdl",n:"Romanian deadlift",m:1},
  {id:"split",n:"Dumbbell split squat",side:1,m:1},
  {id:"calf",n:"Weighted calf raise"},
  {id:"carry",n:"Farmer carry",fix:"40 steps"}]},
 {id:"ca",name:"Core and arms",note:"Short and sweaty",ex:[

    var a=t.done[e.id]||[];if(!a.some(Boolean))return;
    var full=true;for(var i=0;i<pm;i++)if(!a[i])full=false;
    var inp=inputFor(e),w=parseFloat(inp.w)||0,r=inp.r===""?reps(e):inp.r,old=state.lifts[e.id];
    if(old&&old.best&&w>+old.best){prs++;bests.push(e.n+", "+w+" lb")}
    state.lifts[e.id]={n:e.n,w:w||"",r:r,best:Math.max(old&&+old.best||0,w)||"",d:t.date,full:full};
    if(w){var h=state.hist[e.id]||(state.hist[e.id]=[]);h.push([t.date,w,r]);if(h.length>12)h.shift()}
  });
  var mins=t.t0?Math.min(180,Math.max(1,Math.round((Date.now()-t.t0)/60000))):0;
  state.sessions.push({d:t.date,id:s.id,name:s.name,mode:t.mode,sets:d,min:mins,prs:prs});
  if(state.sessions.length>300)state.sessions=state.sessions.slice(-300);
  t.finished=true;stopRest();
  var xp=(t.mode==="min"?25:50)+prs*10;
  award(xp,"");
  summary={name:s.name,sets:d,min:mins,xp:state.xpDays[t.date]||xp,prs:prs,bests:bests,streak:streak(),lvl:lvl(state.xp).l};
  wake(false);tab="done";window.scrollTo(0,0);
 },
 again:function(){var t=state.today;t.finished=false;t.done={};t.inp={};delete t.t0;t.mode="full";tab="train";window.scrollTo(0,0)},
 water:function(){var q=state.today.q;if(q.water<8){q.water++;fx.push([".pips i:nth-child("+q.water+")","pop"])}if(q.water>=8)questPay("water","Water")},
 quest:function(a){state.today.q[a]=true;questPay(a,a==="sleep"?"Sleep":"Walk")},
 qa:function(a){var x=a.split(":");qa[x[0]]=x[1];fx.push(['[data-act=qa][data-a="'+a+'"]',"pop"])},
 lift:function(a,el){
  doRep(el.querySelector("svg"));taps++;
  var h=el.parentNode.querySelector(".liftn");
  if(h)h.textContent=taps+(taps===1?" rep.":" reps.")+(taps===10?" That's a warm-up set.":taps===25?" Save some for the real thing.":"");
  return false;
 },
 signin:function(){
  var n=setupName.trim();if(!n){toast("Type your name first.");return false}
  if(!qaDone()){toast("Answer all three questions.");return false}
  state.profile={name:n.slice(0,30),goal:"bulk",since:today()};applyPick();tab="verdict";window.scrollTo(0,0);
 },
 pick:function(){
  if(!qaDone()){toast("Answer all three questions.");return false}
  applyPick();tab="verdict";window.scrollTo(0,0);
 },
 goal:function(a){state.profile.goal=a==="cut"?"cut":"bulk";delete state.profile.picked;delete state.profile.why;state.profile.manual=true;toast("Switched to "+state.profile.goal+".")},
 pickday:function(a){
  var n=+a,t=state.today;if(!(n>=0&&n<7)||doneCount()>0||t.finished)return false;
  if(n!==dow()&&!PLAN[n])return false;
  t.pick=n===dow()?null:n;t.done={};t.inp={};delete t.t0;
 },
 days:function(a){var n=+a;if(n>=3&&n<=6)state.profile.days=n},
 editw:function(){editing=!editing},
 wtoggle:function(a){state.widgets.forEach(function(w){if(w.id===a)w.on=!w.on})},
 wup:function(a){move(a,-1)},wdown:function(a){move(a,1)},
 reset:function(){confirmReset=true},
 resetno:function(){confirmReset=false},
 resetyes:function(){state=fresh();setupName="";qa={goal:null,exp:null,pace:null};tab="today";confirmReset=false;stopRest();toast("Erased. Fresh start.")},
 skiprest:function(){stopRest();return false}
};
function move(id,dir){
  var ws=state.widgets,i=-1;ws.forEach(function(w,k){if(w.id===id)i=k});
  var j=i+dir;if(i<0||j<0||j>=ws.length)return;var t=ws[i];ws[i]=ws[j];ws[j]=t;
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el||el.disabled)return;
  var fn=A[el.getAttribute("data-act")];if(!fn)return;
  var bx=el.getBoundingClientRect();lastXY=[ev.clientX||bx.left+bx.width/2,(ev.clientY||bx.top)-10];
  rollDay();
  if(fn(el.getAttribute("data-a"),el)===false)return;
  persist();render();
});
document.addEventListener("input",function(ev){
  var el=ev.target;
  if(el.hasAttribute("data-lift")){
    var id=el.getAttribute("data-lift"),e=null;
    moves().forEach(function(x){if(x.id===id)e=x});
    if(!e)PLAN.forEach(function(s){s.ex.forEach(function(x){if(!e&&x.id===id)e=x})});if(!e)return;
    var cur=inputFor(e),nw={w:cur.w,r:cur.r};nw[el.getAttribute("data-f")]=el.value;
    state.today.inp[id]=nw;persist();
  }else if(el.hasAttribute("data-sname")){setupName=el.value}
  else if(el.hasAttribute("data-pname")){var v=el.value.trim();if(v&&state.profile){state.profile.name=v.slice(0,30);persist()}}
  else if(el.hasAttribute("data-goals")){state.goals=el.value.slice(0,600);persist()}
  else if(el.hasAttribute("data-note")){var nid=el.getAttribute("data-note"),nv=el.value.trim().slice(0,120);if(nv)state.notes[nid]=nv;else delete state.notes[nid];persist()}
});
document.addEventListener("change",function(ev){
  var el=ev.target;if(!el.hasAttribute||!el.hasAttribute("data-restore")||!el.files||!el.files[0])return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||typeof o.xp!=="number"||!Array.isArray(o.sessions)||!o.lifts)throw 0;
      state=migrate(o);rollDay();lastPairs={};persist();render();toast("Backup restored.");
    }catch(e){toast("That file isn't a Buff backup.")}
  };
  r.onerror=function(){toast("Could not read that file.")};
  r.readAsText(el.files[0]);
});
document.getElementById("tour").addEventListener("click",function(ev){
  var b=ev.target.closest("[data-tour]");if(!b)return;var a=b.getAttribute("data-tour");
  if(a==="skip")return endTour();
  if(a==="back"){if(tourI>0){tourI--;tourStep(-1)}return}
  if(tourI>=TOUR.length-1)return endTour();
  tourI++;tourStep(1);
});
document.addEventListener("keydown",function(ev){
  if(tourOn&&ev.key==="Escape")endTour();
  if(ev.key==="Enter"&&ev.target&&ev.target.id==="memin"){var b=document.querySelector("[data-act=memadd]");if(b)b.click()}
});
window.addEventListener("resize",placeTour);
window.addEventListener("scroll",function(){if(tourOn)placeTour()},{passive:true});
document.getElementById("lvl").addEventListener("click",function(){this.classList.remove("show")});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"&&dirty){clearTimeout(timer);flush()}
  else if(document.visibilityState==="visible"){
    if(state.today.date!==today()){rollDay();render()}
    if(tab==="train"&&!state.today.finished&&doneCount()>0)wake(true);
  }
});

if(state.profile&&!state.today.finished&&doneCount()>0){tab="train";setTimeout(function(){toast("Picked up where you left off.")},600)}
render();
initCloud();
})();
</script>

if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
